name: PB3469 comment probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'LAB PB3469 ') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert full event context and immutable checkout
        env:
          PROBE_EVENT: ${{ toJSON(github.event) }}
        run: python3 pb3469_probe.py

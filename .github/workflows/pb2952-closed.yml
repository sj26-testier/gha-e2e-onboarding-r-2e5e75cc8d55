name: PB2952 closed negative
on:
  issues:
    types: [closed]
permissions:
  contents: read
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'LAB PB2952 ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert full issue context and immutable checkout
        env:
          PROBE_EVENT: ${{ toJSON(github.event) }}
        run: python3 pb2952_probe.py

name: Issue event probe

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  probe:
    name: Issue payload and checkout
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.issue.title, 'LAB issue-events ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert executed event and source
        env:
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_ACTION: ${{ github.event.action }}
          PROBE_REF: ${{ github.ref }}
          PROBE_SHA: ${{ github.sha }}
          PROBE_WORKFLOW_REF: ${{ github.workflow_ref }}
          PROBE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROBE_ISSUE: ${{ github.event.issue.number }}
          PROBE_COMMENT: ${{ github.event.comment.id }}
          PROBE_TOKEN: ${{ github.token }}
        run: python3 event_probe.py

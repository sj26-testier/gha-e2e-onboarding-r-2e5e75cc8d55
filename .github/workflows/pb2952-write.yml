name: PB2952 write
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'LAB PB2952 ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert full issue context and immutable checkout
        env:
          PROBE_EVENT: ${{ toJSON(github.event) }}
          PROBE_TOKEN: ${{ github.token }}
        run: python3 pb2952_probe.py --write
